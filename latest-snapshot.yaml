    pac.test.appstudio.openshift.io/sha-title: |-
      fix: set immediate-import annotation for Hive clusters independent of MSA (#1792)

      postRestoreActivation only set the
      import.open-cluster-management.io/immediate-import annotation after a
      managed cluster passed through MSA-secret lookup and token decoding.
      Hive-provisioned clusters never get an MSA secret at backup time
      (prepareImportedClusters unconditionally skips MSA setup for them), so
      the annotation could never be set for them - meaning a Hive-deployed
      managed cluster would never be signaled for reimport on a hub whose
      AutoImportStrategy is ImportOnly.

      Set the annotation for Hive-provisioned clusters (isHiveCreatedCluster)
      right after managedClusterShouldReimport confirms a reimport is needed,
      independent of MSA, then move on to the next cluster - Hive clusters
      never have an MSA secret, so without this they would always fall
      through to the MSA lookup below and log a misleading 'no suitable MSA
      secret' message for an expected, by-design state.

      Non-Hive clusters keep the existing MSA-gated behavior unchanged: the
      annotation is only set once a usable MSA token is found and we are
      about to (re)create the auto-import-secret, to avoid forcing a
      reimport retry for a cluster we have no working credential for.

      Extracted the annotation-setting logic into setImmediateImportAnnotation
      for clarity and testability, and switched it to a merge patch instead
      of Update: the ManagedCluster was read earlier in the restore flow and
      other controllers actively update it concurrently (e.g. klusterlet
      status), so its resourceVersion can be stale by the time we write the
      annotation. A merge patch only touches the annotations field and isn't
      subject to that resourceVersion conflict, whereas Update would silently
      fail and leave the annotation unset.

      Added a dedicated test verifying: a Hive cluster with no MSA secret
      still gets the annotation and does NOT log a 'no suitable MSA secret'
      message; a non-Hive cluster with a valid MSA secret still gets the
      annotation; a non-Hive cluster without a usable MSA secret does NOT
      get the annotation (unchanged); and a cluster that doesn't need
      reimporting gets neither.

      Signed-off-by: sahare <sahare@redhat.com>
      Co-authored-by: sahare <sahare@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
