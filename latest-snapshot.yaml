    pac.test.appstudio.openshift.io/sha-title: |-
      fix: upgrade github.com/prometheus/prometheus to v0.305.3 to fix CVE-2026-42151 [rhacm-2.13]

      Bumps `github.com/prometheus/prometheus` from `v0.303.1` to `v0.305.3`
      (root module, `apps/iam`, `pkg/promlib`) to address CVE-2026-42151
      (Azure AD OAuth `client_secret` exposed via the Prometheus remote-write
      config API).

      Also bumps `github.com/grafana/loki/v3` from `v3.2.1` to `v3.6.0`,
      required to satisfy the updated `prometheus/prometheus` module graph.

      Adaptations for breaking API changes:
      - `labels.Labels` moved from a slice type to a struct type; updated
        constructors to use `labels.New()`/`labels.FromStrings()`
      - `labels.Labels` JSON tag changed from `omitempty` to `omitzero`
      - Loki `syntax.Walk` callback now returns `bool`

      Related: ACM-36208
      Signed-off-by: Kate Barreiros <kbarreir@redhat.com>
