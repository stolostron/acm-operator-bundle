    pac.test.appstudio.openshift.io/sha-title: |-
      Surface blocking resource in MCH status conditions (#4757)

      * Surface blocking resources in setup and MCE readiness tracking

      Add resourceIdentifier() helper to format kind/namespace/name in condition
      messages. Update ensure*() functions (namespace, operator group, service
      account, cluster role binding, unstructured resource) to set Progressing
      conditions naming the specific resource being created, instead of generic
      "Created new resource" messages.

      Add RequirementsNotMet condition for multiple OperatorGroup conflict
      (terminal misconfiguration, no requeue) and for invalid MCE subscription/
      ClusterExtension override annotations.

      Change waitForMCEReady() to accept the hub so it can set Progressing/
      WaitingForMCE conditions describing what's blocking MCE readiness: not
      yet present, no version reported (enriched with MCE's own latest
      condition via latestMCECondition()), or version too low. Surface the
      same for MCE CRD not yet available and MCE creation failures in
      ensureMultiClusterEngineCR.

      Retry Subscription/ClusterExtension update conflicts with OLM's own
      status writes quietly (empty result) instead of an explicit requeue, so
      concurrent OLM updates don't starve ensureMultiClusterEngineCR from
      running in the same reconcile.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Propagate reconcile context through finalization cleanup

      Add ctx context.Context parameter to cleanupClusterRoles,
      cleanupClusterRoleBindings, and cleanupMultiClusterEngine instead of
      creating ad-hoc context.Background()/context.TODO() calls. Enables
      proper request tracing and deadline propagation during finalization,
      and lets these functions surface Terminating conditions naming the
      specific resource still blocking cleanup.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Propagate reconcile context through console notification cleanup

      Add ctx context.Context parameter to cleanupConsoleNotifications instead
      of context.TODO(), consistent with the cleanup pattern in finalizers.go.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Surface finalization blocking resource and fix CRD/resource render reason

      Replace the anonymous cleanup-function slice with a named cleanupStep
      struct so finalization failures log which named step (Namespaces,
      ClusterRoles, ClusterRoleBindings, MultiClusterEngine, OrphanMCE,
      ConsoleNotifications) didn't complete, instead of an opaque function
      reference.

      Set a Terminating condition naming the specific component still being
      removed when ensureNoComponent errors or requires a requeue, instead of
      silently retrying with no status visibility.

      Fix deployResources returning CRDRenderReason for what is actually
      ClusterRole rendering failures (this call site renders RBAC resources,
      not CRDs) — use ResourceRenderReason instead.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Surface WaitingForNamespace condition in KlusterletAddonConfig setup

      Set a Progressing/WaitingForNamespace condition naming the ManagedCluster
      namespace when ensureKlusterletAddonConfig is waiting for it to be
      created, and clear it once the namespace exists.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Surface reconciler-path blocking conditions and persist finalization retries

      Set Progressing/RequirementsNotMet conditions for reconciler-path
      failures that were previously only logged: missing image overrides,
      image/template override configmap lookup failures, setDefaults failure,
      SetDefaultStorageClassName failure, namespace label failure, and image
      manifest configmap failure.

      Persist the status update on the finalization retry path: SetHubCondition
      was updating the in-memory struct, but nothing called
      r.Client.Status().Update()/Patch() before returning, so condition updates
      set during an incomplete finalizeHub() were lost every loop. Snapshot the
      object before setting the Terminating condition so the merge patch
      actually includes it.

      Fix broken r.Log.Error calls using %s format verbs (logr doesn't support
      printf-style formatting) by switching to structured key/value pairs.

      Update waitForMCEReady() call site to pass the hub so it can set its own
      WaitingForMCE conditions. Rename the misleading "Install CRDs" comment
      on the deployResources call, which deploys ClusterRoles, not CRDs.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Integrate blocking-resource status changes with MCE upgrade-wait logic

      Add a deletion-timestamp early exit to calculateStatus() that preserves
      existing status and just reports the Uninstalling phase, instead of
      recomputing install-oriented component/version tracking against
      resources that are intentionally being torn down (which produced
      misleading messages like "component is now available" for something
      mid-termination).

      Always surface a Complete:False condition once the hub is no longer
      successful and not paused, rather than only when one already existed,
      so consumers have a stable Complete condition from the first reconcile.

      Add the latestMCECondition() helper (used by waitForMCEReady to enrich
      its wait message with MCE's own latest condition) and fix a
      reflect.DeepEqual bug in syncHubStatus comparing m.Status against
      *original (a pointer) instead of the dereferenced value, which made the
      "status hasn't changed" shortcut never trigger. Treat a NotFound error
      from the status Update call as benign (the object's last finalizer was
      likely just removed, triggering immediate garbage collection).

      Add WaitingForMCEReason, WaitingForNamespaceReason, and
      ComponentNotReadyReason constants for the intermediate MCE/namespace
      readiness phases surfaced by common.go and managedcluster.go, distinct
      from WaitingForMCEUpgradeReason (MCE present but below the required
      version). Remove unused reason constants (AwaitingCRDCreationReason,
      ResourceBlockReason, CertManagerReason, ManagedClusterTerminatingReason,
      NamespaceTerminatingReason).

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Add tests for blocking resource conditions in setup and finalization

      Cover the condition-setting behavior added across common.go,
      finalizers.go, and managedcluster.go: OperatorGroup conflicts, MCE CRD/
      creation/readiness waits, invalid subscription/ClusterExtension override
      annotations, Subscription/ClusterExtension update conflicts (and that
      they don't starve MCE CR creation), named resource creation messages,
      finalization step naming, and the WaitingForNamespace condition in
      KlusterletAddonConfig setup.

      One MCE-ready fixture derives its compliant version from
      version.RequiredMCEVersion instead of a hardcoded literal, matching the
      pattern already used in status_test.go, so a future required-version
      bump doesn't silently break it again.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Add tests for deletion handling, Complete condition, and NotFound status updates

      Cover calculateStatus()'s deletion-timestamp early exit (skips component
      tracking, strips stale Progressing/Complete, preserves the existing
      Terminating condition), the always-present Complete:False condition on
      a fresh install (skipped while paused), and that a specific Progressing
      reason set by an earlier stage isn't downgraded to a generic reconciling
      message. The two calculateStatus tests seed a version-compliant MCE so
      the MCE-upgrade-wait branch (ACM-8659) doesn't take priority and mask
      the behavior under test.

      Also cover syncHubStatus treating a NotFound status-update error as
      benign, the message-refinement regression for SetHubCondition on a
      reused Reason (e.g. Terminating/DeletionTimestampPresent as finalization
      narrows in on what's blocking), and the reflect.DeepEqual pointer-vs-
      value bug that made the "status hasn't changed" shortcut never trigger.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * Fix syncHubStatus comparing the wrong operand in its no-op shortcut

      The "status hasn't changed" shortcut compared m.Status against *original
      instead of the freshly computed newStatus against *original. Since
      calculateStatus() returns a new value without mutating m.Status, and
      almost all condition-setting in this codebase happens by mutating
      m.Status directly during Reconcile() (guarded by error/waiting
      branches), m.Status equals original in the common, error-free case.
      That made the shortcut trigger and silently skip persisting newStatus
      even when it legitimately differed from original — e.g. a component's
      availability changing or the overall phase advancing from Installing to
      Running — effectively freezing the hub's status in the steady-state
      case where no blocking condition ever fires.

      Compare newStatus against *original instead, so the shortcut only skips
      the update when the two are actually equal.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      ---------

      Signed-off-by: dislbenn <dbennett@redhat.com>
