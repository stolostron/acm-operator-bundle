      * [GO MIGRATION BACKPORT] [ACM-46104] ACM-38197-guard-against-flapping-resources #6760 backend migration (#75)

      * ACM-38197-guard-against-flapping-resources #6760 backend migration

      Signed-off-by: Enrique Mingorance Cano <ginxaco@gmail.com>

      * Keep recent violation visible when throttling flapping policies

      When a replicated policy is throttled, remember the most severe
      NonCompliant status seen in the recent history instead of publishing
      the current (possibly Compliant) object. Project that violation onto
      the propagated policy snapshot and onto the root policy's per-cluster
      status so the console continues to show the policy as non-compliant.

      Adds root-policy tracking, violation ranking, and dirty-root event
      generation in the hub event flap state, plus tests for throttled
      snapshot and root projection behavior.

      Signed-off-by: Enrique Mingorance Cano <ginxaco@gmail.com>

