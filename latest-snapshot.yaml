    pac.test.appstudio.openshift.io/sha: 671991b14a8c828edb54b6ba5e2cf7d78757b468
    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-50052 Recover informers from a stale discovery cache without a restart (#7076)

      * fix(backend): refresh cached discovery when informer GVR lookup fails

      The informer factory resolves each WatchSpec through a memory-cached
      discovery client, which snapshots the whole discovery document on first
      use and only drops it on Invalidate. A pod that starts while the hub is
      still establishing CRDs therefore caches a snapshot that is missing them.

      Both failure shapes are served from that snapshot without any API call:
      memory.ErrCacheNotFound ("not found") when the groupVersion is absent,
      and errKindNotFound when a cached resource list does not carry the kind.
      isUnavailable classified both as unavailable, and that branch was the one
      that did not invalidate, so the retry loop re-read the same stale snapshot
      forever and only a pod restart recovered it.

      Resolve now asks for a discovery refresh on any failure and re-resolves
      when the refresh is granted, keeping the refetch and the retry in one
      critical section. Invalidation is coalesced so a hub legitimately missing
      CRDs does not refetch discovery once per missing spec per retry round.

      Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * test(backend): cover stale discovery snapshot recovery

      Add regression coverage for the informer GVR retry path:

      - TestUnavailableCRDRefreshIsCoalesced asserts that 20 permanently
        missing specs trigger exactly one discovery refetch, so a hub without
        AAP or without the ACM CRDs does not hammer discovery every round.
      - TestStaleDiscoverySnapshotRecoversWithoutRestart drives the ACM-50052
        scenario end to end: a mapper whose cached snapshot predates the CRD
        fails every lookup until invalidated, and the informer must still sync
        without a pod restart.

      Both fail without the preceding fix.

      Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * docs(backend): correct resolveGVR note on how the refresh is serialized

      The comment claimed that re-resolving after a granted refresh keeps the
      refetch and the retry in the same critical section. It does not: the
      discoveryRefresh mutex only guards the invalidation decision and the
      Invalidate call, and is released before the second lookup. The refetch
      happens inside the discovery client, whose own lock is what collapses
      concurrent callers into a single fetch.

      The behaviour the comment describes still holds, so this is a comment-only
      change, but the stated mechanism would have left a future reader relying on
      a lock guarantee that is not there.

      Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * test(backend): wait for every spec instead of sleeping in coalescing test

      TestUnavailableCRDRefreshIsCoalesced asserted the invalidation count after a
      flat 300ms sleep while its sibling tests poll with deadlines. On a loaded
      runner that risks a misleading failure, and it is also too weak: a spec whose
      goroutine has not started cannot have invalidated, so a short sleep could
      count one invalidation and pass for the wrong reason.

      Poll SpecStatuses until all 20 specs have recorded a resolve error, then
      assert exactly one invalidation. Verified it still fails (20 invalidations)
      when discoveryRefreshInterval is forced to 0.

      Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * fix(backend): re-resolve after a denied discovery refresh grant

      Only the spec granted the Invalidate re-resolved, so a sibling that failed
      while the winner was still refetching was denied the grant and returned its
      stale failure, sleeping a full retryBase even though the document it needed
      had just been refreshed.

      Every spec backed by a caching mapper now re-resolves once after a failure.
      Invalidate deliberately stays inside the throttle lock: a denied caller blocks
      until the winner's invalidation has completed, so "denied" also means "the
      document is already being refreshed", which is what makes the immediate
      re-read safe rather than racy.

      The cost is one extra lookup per failing spec per round — a map read while the
      cached document is valid, a refetch attempt while it is not.

      Also records the retryBase / discoveryRefreshInterval coupling as a comment so
      the two constants are not moved independently.

      Co-authored-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * test(backend): cover same-round re-resolve and the refresh throttle

      TestDeniedSpecReresolvesInSameRound drives two specs that fail together, so
      exactly one wins the Invalidate grant and the other must still recover in the
      same round. The mapper latches its wave decision before the barrier instead of
      re-reading it after, so a sibling parked on the barrier cannot be rescued by a
      refresh that landed while it waited; without that, the test measures goroutine
      scheduling rather than the behavior under test. Verified it fails 15/15 runs
      when resolveGVR re-resolves only on a granted request.

      TestDiscoveryRefreshAllowsAfterInterval covers discoveryRefresh.request
      directly: denied inside the interval without invalidating, granted after it.

      Co-authored-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      ---------

