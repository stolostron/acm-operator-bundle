    pac.test.appstudio.openshift.io/sha: 21072d1b24e1603055a56c276c19938814dbe8b8
    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-34843: Implement new NodePool health statuses (#6442)

      * ACM-34843 Add NodePool condition type constants and unified status derivation

      Add NodePoolConditionType enum with all 17 HyperShift NodePool condition
      types, replacing magic strings throughout the codebase. Implement a single
      getNodePoolStatus() utility with priority-based status derivation:
      error > warning > updating > pending > ready.

      Includes 33 unit tests covering every status path, priority ordering,
      multiple simultaneous conditions, and edge cases.

      Ultraworked with [Sisyphus](https://github.com/code-yeongyu/oh-my-openagent)

      Co-authored-by: Sisyphus <clio-agent@sisyphuslabs.ai>
      Signed-off-by: fxiang1 <fxiang@redhat.com>

      * ACM-34843 Update NodePool status rendering with AcmInlineStatus and condition popover

      Replace simple Ready/Pending icon rendering in NodePoolsTable with
      AcmInlineStatus component showing error (red), warning (yellow),
      updating (blue/spinner), pending (spinner), and ready (green) states.
      Add popover on status cell displaying all conditions with icons and
      messages so users can see details without checking YAML.

      Update NodePoolsProgress stepper to reflect error and warning states
      with appropriate icons (ExclamationCircleIcon, ExclamationTriangleIcon).
      Remove duplicate getNodePoolStatus/getNodePoolsStatus functions,
      re-export consolidated function from resources.

      Update existing tests for new function signature and add error/warning
      stepper coverage.

      Ultraworked with [Sisyphus](https://github.com/code-yeongyu/oh-my-openagent)

      Co-authored-by: Sisyphus <clio-agent@sisyphuslabs.ai>
      Signed-off-by: fxiang1 <fxiang@redhat.com>

      * ACM-34843 Update upgrade-readiness gating to use consolidated status

      Update DistributionField and ClusterActionDropdown to import
      getNodePoolStatus from resources instead of the removed
      getNodepoolStatus from NodePoolsTable. Use .isReady property
      for upgrade gating instead of string comparison.

      Ultraworked with [Sisyphus](https://github.com/code-yeongyu/oh-my-openagent)

      Co-authored-by: Sisyphus <clio-agent@sisyphuslabs.ai>
      Signed-off-by: fxiang1 <fxiang@redhat.com>

      * Fix check and CodeRabbit comments

      Signed-off-by: fxiang1 <fxiang@redhat.com>

      * Reuse translation

      Signed-off-by: fxiang1 <fxiang@redhat.com>

      ---------

      Signed-off-by: fxiang1 <fxiang@redhat.com>
      Co-authored-by: Sisyphus <clio-agent@sisyphuslabs.ai>
