    pac.test.appstudio.openshift.io/sha-title: |-
      fix: add replace directive for prometheus to fix CVE-2026-42151 [rhacm-2.13] (#2651)

      * fix: add replace directive for prometheus to fix CVE-2026-42151 [rhacm-2.13]

      Direct upgrade to v0.305.3+ is not feasible on release-2.13 due to
      incompatible API changes between v0.52.1 (Prometheus 2.52) and the
      patched v3.x releases. Adds a replace directive pointing
      github.com/prometheus/prometheus to katekeiroz-dev/prometheus with the
      CVE-2026-42151 fix (Azure AD OAuth client_secret exposure) cherry-picked
      onto v0.52.1.

      The prometheus fork's own go.mod requires github.com/prometheus/common
      v0.54.0, which breaks github.com/thanos-io/thanos v0.35.1's
      pkg/clientconfig (Secret/secret API incompatibility). Pins
      prometheus/common back to v0.53.0 via an explicit replace directive to
      avoid an unrelated, unverified major bump to thanos as a side effect of
      this security backport.

      Related: ACM-36201
      Signed-off-by: Kate Barreiros <kbarreir@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: use stolostron/prometheus fork instead of personal fork

      Replace katekeiroz-dev/prometheus with stolostron/prometheus for
      CVE-2026-42151 replace directive. Same commit, org-owned branch.

      Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
      Signed-off-by: Subbarao Meduri <smeduri@redhat.com>

      * fix: use stolostron/prometheus release-2.13 branch for CVE-2026-42151

      Switch from cherry-pick fork branch to stolostron/prometheus release-2.13
      branch commit 82aa3b09cb50 for the CVE fix, as suggested in PR #2653.

      Signed-off-by: Kate Barreiros <kbarreir@redhat.com>

