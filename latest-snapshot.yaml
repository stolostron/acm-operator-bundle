    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-39253 fix(clusters): differentiate automation secrets by cluster name (#6733)

      * fix(clusters): differentiate automation secrets by cluster name (ACM-39253)

      Hosted Control Plane clusters (e.g. OpenShift Virtualization) are all
      created in a shared Hosted cluster namespace. The Ansible automation
      (toweraccess) Secrets were named only by curation (toweraccess-<curation>),
      so creating a second cluster in the same namespace collided with the
      existing Secret and failed.

      Render the Secret name and the ClusterCurator towerAuthSecret from the same
      live cluster name in the creation template: a 'secretName' helper names each
      Secret and a 'curatorSpec' helper rewrites the matching towerAuthSecret
      references. Both derive from getName/getNamespace at render time, so the name
      shown in the YAML editor is exactly what is created and the reference can
      never drift from the Secret as the cluster name changes. Names are
      differentiated (toweraccess-<curation>-<clusterName>) only when the cluster
      namespace differs from its name; Hive clusters keep the undifferentiated name
      expected by the Update/Remove automation actions.

      Also fall back to the cluster name in getNamespace so the ClusterCurator and
      copied automation Secrets are created in the cluster's own namespace for
      non-HCP clusters (previously rendered with an empty namespace).

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * test(clusters): cover shared-namespace automation secret naming (ACM-39253)

      Add a CreateCluster KubeVirt test that selects an automation template and
      verifies the copied toweraccess Secret and the ClusterCurator
      towerAuthSecret reference are differentiated by cluster name
      (toweraccess-upgrade-test) when created in the shared 'clusters' namespace.
      Add ControlDataHelpers unit tests for secretName and differentiateCuratorSecrets
      covering shared vs dedicated namespaces and the no-drift/no-double-append
      behavior when the cluster name changes. Update the AWS ansible mocks to expect
      the ClusterCurator and copied Secrets in the cluster namespace.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * SonarQube maintainability issue

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      ---------

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
