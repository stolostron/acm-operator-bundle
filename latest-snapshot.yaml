    pac.test.appstudio.openshift.io/sha-title: |-
      [2.17] fix: bump Go builder to 1.26 and golang.org/x/crypto to v0.56.0 (#2825)

      * fix: bump Go builder to 1.26 and golang.org/x/crypto to v0.56.0

      Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
      Signed-off-by: Chai Bot <chai-bot@redhat.com>

      * fix: address Go 1.26 lint modernize issues

      Apply golangci-lint modernize fixes:
      - Replace proto.String/Int64/Float64, ptr.To, stringPtr, intptr with
        Go 1.26 new(value) syntax
      - Replace strings.Split with strings.Cut where appropriate
      - Replace backward loop with slices.Backward
      - Use fmt.Fprintf instead of WriteString(fmt.Sprintf(...))
      - Use reflect.Pointer instead of reflect.Ptr
      - Simplify errors.As with AsType

      Signed-off-by: redhat-chai-bot <redhat-chai-bot@users.noreply.github.com>

      * fix: remove unused stringPtr function and fix whitespace after modernize

      The Go 1.26 modernize auto-fix inlined stringPtr() calls but left the
      function definition, triggering the golangci-lint unused check. Also
      removes a leading blank line inside a for-loop body in kube_debug.go
      flagged by the whitespace linter.

      Signed-off-by: redhat-chai-bot <redhat-chai-bot@users.noreply.github.com>

      ---------

