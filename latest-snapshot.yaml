    pac.test.appstudio.openshift.io/sha-title: |-
      fix: require explicit confirmation annotation for CleanupAll restores (#1725)

      cleanupBeforeRestore=CleanupAll drives the operator's own ServiceAccount
      to mass-delete ACM-scoped Secrets, ConfigMaps, and discovered CRs that
      are not present in the selected backup. This was reachable from
      Restore.spec alone, so any principal able to create a Restore CR could
      trigger a broad, irreversible deletion across the hub using the
      operator's elevated permissions, independent of their own RBAC.

      CleanupAll now additionally requires the
      cluster.open-cluster-management.io/restore-cleanup-all-confirmed: "true"
      annotation on the Restore CR. Without it, the Restore is rejected with
      a validation error naming the required annotation, rather than
      silently running (or silently skipping) the cleanup.

      Addresses: CVE-2026-66800

      Signed-off-by: sahare <sahare@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
