    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-46026, ACM-37782: [release-2.17] add compliance banners (#4781)

      * ACM-37782: Add ConsoleNotification banners for MCE and OCP version mismatch

      Backport the MCE version mismatch banner framework from main (PR #4394)
      to release-2.17, and add a new OCP version mismatch banner that warns
      when the cluster is running below the minimum supported OCP version.

      - Create ConsoleNotification resources (console.openshift.io/v1) for
        MCE version mismatch (ahead/behind) and OCP below minimum (4.19.0)
      - Banners auto-remove when compliance is restored
      - Banners cleaned up on MCH deletion via label-based DeleteAllOf
      - Update MinimumOCPVersion from stale 4.10.0 to 4.19.0 to match
        the actual ACM 2.17 support matrix (OCP v4.19-v4.23)
      - Register console.openshift.io/v1 scheme and RBAC permissions
      - Add unit tests for banner create, update, remove, and edge cases

      Signed-off-by: Nathaniel Graham <ngraham@redhat.com>

      * ACM-38144: add support link to MCE compliance banner (#4469)

      Add clickable 'Contact Red Hat Support' link to the MCE version
      mismatch ConsoleNotification banner, directing users to
      https://access.redhat.com/support for assistance.

      Signed-off-by: Nathaniel Graham <ngraham@redhat.com>

      * Use PatternFly CSS vars for banner colors (#4472)

      Replace hardcoded hex colors with PatternFly CSS custom properties so
      the danger banner respects the cluster's theme (light/dark mode) and
      stays consistent with the Console's own PatternFly version.

      PF6 tokens are used as primary values with PF5 tokens as fallback for
      older clusters.

      Signed-off-by: Nathaniel Graham <ngraham@redhat.com>

      * ACM-46026: fix ConsoleNotification lifecycle updates

      Signed-off-by: Nathaniel Graham <ngraham@redhat.com>

      * ACM-37782: set ACM 2.17 OCP minimum to 4.20

      Signed-off-by: Nathaniel Graham <ngraham@redhat.com>

      ---------

      Signed-off-by: Nathaniel Graham <ngraham@redhat.com>
