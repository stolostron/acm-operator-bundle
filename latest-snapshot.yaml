      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * latest coderabbit tweaks minor changes

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * ACM-42599 Implement TLS profile hot-reload in Go

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Revert "ACM-42599 Implement TLS profile hot-reload in Go"

      This reverts commit d25b5639e398709bee94720f887c063126e613ae.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Fix RBAC client single-flight handling during cache cleanup

      Prevent cleanup from evicting token states while a Kubernetes client is
      still being created, which could cause redundant newClient calls or
      waiters to fail. Retry clientFor instead of returning an error when the
      token state is evicted mid-flight, and ensure only the creator owning
      the current wait channel publishes the result.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

