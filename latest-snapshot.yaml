    pac.test.appstudio.openshift.io/sha: b9240a7a786259df5aa22474579a1f2e21e99101
    pac.test.appstudio.openshift.io/sha-title: |-
      fix(rbac): ACM-43077 add configmaps get and routes list to search-api ClusterRole (#878)

      * Increase lint timeout in prow to 10m

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * fix(rbac): add configmaps get and routes list to search-api ClusterRole

      The search-api pod panics with a nil pointer dereference when it cannot
      retrieve federation configuration.  The root cause is that the
      search-api-sa service account is missing two RBAC permissions that the
      federated query path (pkg/federated/fedConfig.go) requires:

        1. configmaps get — needed to read the search-ca-crt ConfigMap in the
           ACM namespace to build the TLS CA bundle used for hub-to-hub TLS.
        2. routes list (route.openshift.io) — needed to discover the console
           and cluster-proxy-addon-user routes for hub URL resolution.

      These were present on the old shared search-serviceaccount but were not
      carried forward when PR #832 introduced the per-component SA split.

      Fix: add both rules to the pre-provisioned search-api ClusterRole in
      both the kustomize path (config/rbac/search_api_clusterrole.yaml) and
      the OLM bundle path (bundle/manifests/search-api-clusterrole.yaml),
      keeping the two files in sync as required.

      Also extends TestSearchAPIClusterRoleHasCachePermissions to assert
      both new permissions so the gap cannot regress silently.

      Fixes: ACM-43077
      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * Cleanup comments

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      ---------

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>
