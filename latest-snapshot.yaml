    pac.test.appstudio.openshift.io/sha-title: |-
      fix(rbac): forward-port tokenReview hardening fixes from release-2.17 (#767) (#770)

      * fix(rbac): forward-port tokenReview hardening fixes from release-2.17

      PR #767 (a release-2.17 backport of #754/#730) received two follow-up
      fixes during review that were never applied to main:

      - pkg/rbac/tokenReview.go: use a keyed HMAC-SHA256 (with a random
        per-process secret) instead of a bare SHA-256 hash for the
        tokenReviews cache key. Addresses CodeQL go/weak-sensitive-data-hashing
        (CWE-327/328/916) -- the raw bearer token is sensitive data, and a
        bare hash lets an attacker who only observes cache keys precompute
        or reverse them.

      - pkg/rbac/userData.go: GetUserDataCache's debug log read
        cache.tokenReviews directly, without holding tokenReviewsLock. Since
        GetTokenReview evicts expired/oldest entries under that lock, a
        concurrent eviction could remove the entry between creation and this
        read, causing a concurrent map read/write panic or a nil-pointer
        dereference. Use the already-resolved userInfo.Username instead.

      Also forward-ports the sonar/go/prow Makefile.prow override added
      during #767 to fix a Go build-cache corruption issue seen in the
      sonar-pre-submit CI job.

      Verified with 'go build ./...', 'go vet ./...',
      'go test ./pkg/... -count=1', 'go test ./pkg/rbac/... -race', and
      'golangci-lint run --timeout=3m' (0 issues).

      Related: https://github.com/stolostron/search-v2-api/pull/767
      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * test(rbac): cover newHashTokenKey CSPRNG-failure fallback path

      This PR's diff against main is much smaller than #767's diff against
      release-2.17 (which included the full ACM-38628 eviction/cap feature),
      so the same never-triggered rand.Read failure fallback in
      newHashTokenKey makes up a much larger share of 'new code' here,
      pushing the SonarCloud new_coverage gate below the required 70%
      threshold (was 50.0%).

      Split newHashTokenKey into a thin wrapper and a newHashTokenKeyFrom
      helper that accepts an io.Reader, so the fallback branch can be
      exercised deterministically in a test via testing/iotest.ErrReader,
      without depending on crypto/rand actually failing (which practically
      never happens). No behavior change: newHashTokenKey still delegates to
      newHashTokenKeyFrom(rand.Reader).

      Verified with 'go test ./pkg/rbac/... -race -coverprofile' (both
      newHashTokenKey and newHashTokenKeyFrom now at 100% coverage) and
      'golangci-lint run --timeout=3m' (0 issues).

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      ---------

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>
