    pac.test.appstudio.openshift.io/sha: 4bd9aea247d184d8c701cf91aa53f980482ca9c4
    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-34432 fix make bundle and pin operator-sdk to v1.37.0 (#846)

      * ACM-34432 fix make bundle and pin operator-sdk to v1.37.0

      - Pin operator-sdk to v1.37.0 via a new Makefile download target (bin/operator-sdk),
        consistent with the existing controller-gen and kustomize pattern; removes reliance
        on any globally-installed operator-sdk version.
      - Fix sed -i compatibility on macOS (BSD sed): use sed -i.bak / rm -f *.bak,
        which works identically on both GNU sed (Linux) and BSD sed (macOS).
      - Regenerate bundle CSV to reflect ACM-34432 RBAC changes (remove impersonate,
        add clusterroles create/delete/get/list/update verbs).
      - Add OPERATOR_ORG and OPERATOR_CHART env vars to config/manager/manager.yaml.

      Jira: ACM-34432
      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * fix: harden operator-sdk download target

      - Use GOHOSTOS/GOHOSTARCH instead of GOOS/GOARCH so the downloaded
        binary always matches the local host, even under cross-compilation.
      - Validate an existing binary's version before reusing it; redownload
        when OPERATOR_SDK_VERSION doesn't match the cached binary.
      - Follow HTTP redirects with -fL and download to a temp file; verify
        the SHA-256 checksum against the published checksums.txt before
        installing the binary.

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      ---------

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>
