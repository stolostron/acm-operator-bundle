    pac.test.appstudio.openshift.io/sha-title: |-
      MCOA: Correctly ignore pending clusters (#2786)

      Previously, we based our decision on which clusters to ignore, for
      deletion, on the clusterList. However the clusterList is already
      filtered on some clusters (`LabelSelector:
      "vendor!=auto-detect,observability!=disabled"}` which caused us not
      correctly add all relevant cluster to the ignored cluster list.

      A result of this, is that a managed cluster pending import, would
      completetly block deletion of the Observability stack.

      Signed-off-by: Jacob Baungard Hansen <jacobbaungard@redhat.com>
