    pac.test.appstudio.openshift.io/sha-title: |-
      Fix misleading OADP webhook error message on OLM v1 clusters (#4567)

      The OADP annotation validation hardcodes OLM v0 since OADP does not yet
      support OLM v1. On a v1 cluster, the error message incorrectly stated
      "This cluster uses OLM v0". Add a reason parameter to
      validateOLMAnnotationPair so callers can provide context-specific
      explanations.

      Signed-off-by: dislbenn <dbennett@redhat.com>
      Co-authored-by: Claude Opus 4.6 <noreply@anthropic.com>
