    pac.test.appstudio.openshift.io/sha-title: |-
      [release-2.14] ACM-38628 / ACM-35367 - evict expired tokenReview cache entries, cap size, and hash keys (#773)

      Cherry-pick of https://github.com/stolostron/search-v2-api/pull/767
      (release-2.17), which combined #754 (ACM-38628) and #730 (ACM-35367)
      plus review follow-ups. None of the underlying fixes (#754, #730) had
      previously been cherry-picked to release-2.14, so this applies the
      full combined change:

      - pkg/rbac/tokenReview.go: evict expired entries on every
        GetTokenReview call, cap the cache size (AUTH_CACHE_MAX_SIZE,
        default 100), and use a keyed HMAC-SHA256 (per-process random
        secret) instead of a raw token as the cache map key.
      - pkg/rbac/userData.go: removed unlocked cache.tokenReviews access in
        GetUserDataCache's debug log, using the already-resolved
        userInfo.Username instead (avoids a concurrent map read/write panic
        now that GetTokenReview evicts entries under the lock).
      - pkg/config/config.go: added AuthCacheMaxSize config option.
      - pkg/rbac/userData_test.go: updated inline cache seed to key by
        hashToken(...) instead of the raw token string. (This branch has no
        watchCache.go/watchCache_test.go yet, so no analogous change was
        needed there.)
      - Makefile.prow: added sonar/go/prow override to clean the Go build
        cache before delegating to the shared harness target, fixing a CI
        cache-corruption flake seen in sonar-pre-submit.

      release-2.14's tokenReview.go/tokenReview_test.go were byte-identical
      to release-2.17's pre-#767 baseline, so those two files were copied
      verbatim from the merged release-2.17 result. userData.go and
      config.go differ per-branch, so the equivalent targeted edits were
      applied and verified against this branch's actual content.

      Verified with 'go build ./...', 'go vet ./...',
      'go test ./pkg/... -count=1', 'go test ./pkg/rbac/... -race',
      'golangci-lint run --timeout=3m' (0 issues), and
      'gosec -exclude-dir=graph/generated ./...' (0 issues).

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>
