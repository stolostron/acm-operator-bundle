    pac.test.appstudio.openshift.io/sha-title: |-
      Stamp replicated policies with ManagedCluster UID

      Previously, when a ManagedCluster was deleted and then recreated with
      the same name, there was no way to tell whether the replicated Policy
      was "fresh" (belonging to the new instance) or was somehow "leftover".
      In particular, this could lead to status updates from the "old" cluster
      being applied to the "fresh" Policy incorrectly.

      Now, the propagator puts the UID of the ManagedCluster resource in an
      annotation on replicated Policies, which should allow other controllers
      to determine whether they are updating the expected resource. The
      propagator itself can not and does not enforce the correct behavior.

      Refs:
       - https://issues.redhat.com/browse/ACM-43196

      Signed-off-by: Justin Kulikauskas <jkulikau@redhat.com>
      Co-authored-by: OpenAI Codex <noreply@openai.com>
      (cherry picked from commit 36a468f6fe1c07e8bc7aebe5b7315f845d636352)
