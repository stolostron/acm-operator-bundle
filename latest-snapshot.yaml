    pac.test.appstudio.openshift.io/sha-title: |-
      docs: document open-cluster-management-backup NetworkPolicy design (#1682)

      * docs: document open-cluster-management-backup NetworkPolicy design

      Explains the deny-by-default NetworkPolicy set added in
      multiclusterhub-operator#4431 (ACM-37736, ACM-31154): per-component
      allowed flows, the DNS port 5353 quirk, unrestricted storage egress
      for velero/node-agent, and the testing performed. Follows the same
      docs/NETWORK_POLICIES.md convention introduced by insights-client#649
      and insights-metrics#529.

      Co-authored-by: Cursor <cursoragent@cursor.com>
      Signed-off-by: sahare <sahare@redhat.com>

      * docs: fix broken anchor link and clarify apiserver-egress scope

      Addresses CodeRabbit review on PR #1682:
      - Fix broken intra-doc link (GitHub strips "/" from anchors, so
        "Velero/node-agent" becomes "veleronode-agent", not "velerode-agent")
      - Clarify that allow-apiserver-egress has no destination selector,
        so it opens ports 443/6443 to any destination, not only the API
        server, despite the policy's name

      Signed-off-by: sahare <sahare@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * docs: fix design-principles summary to match apiserver-egress fix

      Addresses follow-up CodeRabbit review on PR #1682: the "Design
      principles" bullet still implied API server egress was locked down
      to specific ports/namespaces after the previous fix corrected the
      detailed table to say it's port-only with no destination selector.
      Updated the summary bullet to match and link to the relevant section.

      Signed-off-by: sahare <sahare@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      ---------

      Signed-off-by: sahare <sahare@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
