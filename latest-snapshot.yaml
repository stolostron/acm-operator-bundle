    pac.test.appstudio.openshift.io/sha-title: |-
      fix: update labels API usage for prometheus v0.305.3 compatibility

      Align with upstream grafana/grafana labels API patterns:

      Production code (sender.go):
      - Change `make(labels.Labels, ...)` to `make([]labels.Label, ...)`
      - Return `labels.New(ls...)` instead of raw slice (matches upstream)

      Test code:
      - promql_compat_test.go: use `labels.FromStrings()` for Metric field
      - sender_test.go: use `labels.New([]labels.Label{...}...)` for expected results

      In prometheus v0.305.3, the default Labels type changed from []Label
      (slice) to struct (stringlabels variant). Raw slice patterns and
      make(labels.Labels) no longer compile. These changes are forward-
      compatible — they work with both v0.303.1 and v0.305.3.

      Related: ACM-36227

      Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
