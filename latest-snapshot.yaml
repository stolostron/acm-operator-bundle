    pac.test.appstudio.openshift.io/sha-title: |-
      fix: exclude RBAC and admission-control resources from Velero restore (#1712)

      Exclude cluster-scoped RBAC and admission webhook resources from all
      Velero Restores emitted by this operator. The backup side never writes
      these API groups into legitimate backups, so this exclusion is lossless
      and prevents a tampered BackupStorageLocation tarball from injecting
      privilege-escalating objects (e.g., ClusterRoleBindings) when
      IncludeClusterResources=true and ExistingResourcePolicy=update are set.

      Addresses: CVE-2026-66797

      Signed-off-by: sahare <sahare@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
