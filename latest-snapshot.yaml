    pac.test.appstudio.openshift.io/sha-title: |-
      fix: prevent Perses datasources from rendering on spoke clusters

      The PersesDatasource templates (datasource.yaml, platform-prometheus-datasource.yaml)
      were guarded by .Values.monitoringUIPlugin, which is true on spokes when incident
      detection is enabled. These datasources reference hub-only services (rbac-query-proxy,
      thanos-querier) in the open-cluster-management-observability namespace that does not
      exist on spokes, causing ManifestWork to fail and MCOA to never become available.

      Guard the datasource templates on .Values.dashboards instead, which is only populated
      on hub clusters via enableUI(). The UIPlugin continues to render on spokes for
      incident detection.

      Resolves: ACM-44865

      Co-Authored-By: Claude Opus 4.6 (1M context) <noreply@anthropic.com>
      Signed-off-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>
