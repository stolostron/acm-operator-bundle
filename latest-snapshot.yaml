    pac.test.appstudio.openshift.io/sha-title: |-
      fix(overview): correct inverted toggle icons in expandable sections (ACM-37147) (#6471)

      * fix(overview): correct inverted toggle icons in expandable sections (ACM-37147)

      The expand/collapse toggle icons in the Overview page sections (Insights,
      Cluster health, Your view) were using inverted logic. When a section was
      expanded it showed AngleDownIcon, and when collapsed it showed AngleUpIcon,
      which is the opposite of the UX standard and the pattern used by AcmExpandableCard.

      Fixed all three toggles to show AngleUpIcon when expanded (indicating 'click
      to collapse') and AngleDownIcon when collapsed (indicating 'click to expand').

      Added a regression test that verifies the correct icon is rendered in each
      state for all three toggle buttons.

      Signed-off-by: zlayne <zlayne@redhat.com>

      * fix(overview): correct inverted toggle icons in expandable sections (ACM-37147)

      The expand/collapse toggle icons in the Overview page sections (Insights,
