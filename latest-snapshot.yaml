    pac.test.appstudio.openshift.io/sha-title: |-
      CVE-2026-73834: redact more sensitive information

      For common types like Secrets, `oc adm inspect` automatically redacts
      potentially sensitive fields. For more ACM-specific types, must-gather
      has to manually redact the fields. The sensitive resources handled here
      are: Secrets, Routes, Proxies, and OAuthClients. The "wrapper" kinds in
      ACM handled here are: ConfigurationPolicies, Policies, AddonTemplates,
      SyncSets, SelectorSyncSets, and ManifestWorks. Nested "wrapper" kinds
      are recursively redacted.

      The implementation uses `jq` filters for the redactions, which required
      changing the output format for these resources to JSON, from YAML. They
      are placed in the same directories as before. The redactions generally
      follow what `oc adm inspect` would do, although notably it does *not*
      count bytes/characters in Secrets and OAuthClients.

      Refs:
       - https://issues.redhat.com/browse/ACM-41741

      Signed-off-by: Justin Kulikauskas <jkulikau@redhat.com>
