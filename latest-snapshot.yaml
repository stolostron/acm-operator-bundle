    pac.test.appstudio.openshift.io/sha-title: |-
      CNF-22904: Upgrade bmo dependency (#1445)

      * CNF-22904: Upgrade BareMetal Operator APIs for host networking support

      Update the BMO API dependency to revision 9f0b8a962650 and include
      the accompanying Kubernetes, controller-runtime, and transitive
      dependency updates. Refresh the vendored dependencies independently
      of the SiteConfig feature changes.

      Signed-off-by: Allain Legacy <alegacy@redhat.com>

      * CNF-22904: Replace deprecated controller-runtime scheme builder

      Use the apimachinery scheme builder recommended by controller-runtime
      v0.24.1. Register ClusterInstance types and group metadata explicitly,
      preserving the existing AddToScheme behavior.

      Assisted-by: Codex (GPT-6.1-Sol/medium)
      Signed-off-by: Allain Legacy <alegacy@redhat.com>

      * CNF-30262: Hold Renovate updates for the BMO API pin

      Allow stable BMO API releases starting at v0.15.0 and disable digest
      updates so Renovate preserves the commit with host networking support
      until a qualifying release is available.

      Assisted-by: Codex (gpt-6.2-sol/medium)
      Signed-off-by: Allain Legacy <alegacy@redhat.com>

      ---------

      Signed-off-by: Allain Legacy <alegacy@redhat.com>
