    pac.test.appstudio.openshift.io/sha-title: |-
      [ACM-45848] [GO MIGRATION BACKPORT] ACM-42873 When ACM import MCE standalone, search errors show up in the MCE console pod of the stanadlone MCE cluster (#6865) (#6952)

      * [GO MIGRATION BACKPORT] ACM-42873 When ACM import MCE standalone, search errors show up in the MCE console pod of the stanadlone MCE cluster

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * engine.go searchLoop lock

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Recheck MCH presence between failed search API pings

      Refactor searchLoop so each retry re-evaluates whether the MultiClusterHub
      still exists, instead of looping on Ping alone. This prevents the engine
      from waiting indefinitely for the search API when MCH has been removed.
      Add a test covering the recheck behavior.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Distinguish transient MCH list errors from missing CRD/absent MCH

      Update hubresources.MCHPresent to return an error for unexpected list
      failures, while treating missing CRD (NotFound/NoMatch) and empty results
      as "not present". Update the aggregation engine to log MCH list errors
      and continue searching instead of skipping aggregation. Add tests for
      transient list errors, missing CRD, and no-match errors.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Add timeout to MCH presence check in aggregation engine

      Wrap the MultiClusterHub presence lookup in searchLoop with a 30-second
      context timeout so a slow or stuck MCH list does not block the search
      loop indefinitely.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Strengthen test coverage for MCH recheck between failed search pings

      Replace the generic countingSearch helper in
      TestSearchLoopRechecksMCHBetweenFailedPings with an explicit httptest
      server that records how many MultiClusterHub list operations occurred
      before each failed ping. Add assertions verifying at least two pings
      occurred and that the second ping observed at least two hub lists,
      ensuring the engine rechecks MCH presence between retries.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      ---------

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
