    pac.test.appstudio.openshift.io/sha-title: |-
      fix(e2e): storage-class expansion validation and rightsizing test cleanup (#2816)

      - Export webhook helper functions (GetSelectedStorageClassForMultiClusterObservability,
        StorageClassAllowVolumeExpansion) for reuse in test utilities
      - Update ModifyMCOCR to check storage-class expansion capability before resizing,
        preventing webhook rejection of CR updates when expansion is not allowed
      - Add Skip guard to RHACM4K-2821 test (storage resize) when expansion not supported
      - Remove @e2e labels from rightsizing test containers to exclude them from e2e runs
      - Add @e2e label to mcoa_ddr/g0 test

      Signed-off-by: Subbarao Meduri <smeduri@redhat.com>
