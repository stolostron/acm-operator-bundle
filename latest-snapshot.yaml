    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-34431: isolate indexer with dedicated search-indexer-sa ServiceAccount (#791)

      * ACM-34431: isolate indexer with dedicated search-indexer-sa ServiceAccount

      The search-indexer shares the generic search-serviceaccount, which
      carries far more permissions than the indexer needs. A compromise of
      the indexer pod can therefore exercise those excess rights.

      Introduce a dedicated 'search-indexer-sa' ServiceAccount bound to a new
      'search-indexer' ClusterRole with only the permissions verified from
      source (pkg/server/authn.go, pkg/clustersync/leaderElection.go,
      pkg/clustersync/clusterSync.go):

        - authentication.k8s.io/tokenreviews create
            authn middleware validates incoming collector bearer tokens
        - coordination.k8s.io/leases get/create/update
            leader election lock
        - cluster.open-cluster-management.io/managedclusters get/list/watch
        - internal.open-cluster-management.io/managedclusterinfos get/list/watch
        - addon.open-cluster-management.io/managedclusteraddons get/list/watch
            cluster-sync dynamic informers and stale-resource cleanup

      The indexer does not use impersonate, secrets/configmap writes, or
      deployment verbs. SearchIndexerServiceAccount returns an error if
      SetControllerReference fails so the reconcile loop aborts before
      creating an ownerless SA.

      Part of ACM-34431 (FIND-001, CWE-269).

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * fix: address review comments on indexer RBAC and tests

      Three issues addressed:

      1. Remove ineffective SetControllerReference from IndexerClusterRole and
         IndexerClusterRoleBinding. ClusterRole/ClusterRoleBinding are cluster-scoped;
         Search is namespaced. Kubernetes forbids a namespaced owner on a
         cluster-scoped dependent, so SetControllerReference always returns an error
         (silently logged). The call never had any effect.

      2. Add explicit cleanup of 'search-indexer' ClusterRole and ClusterRoleBinding
         in finalizeSearch. Without owner references, the resources are orphaned when
         the Search CR is deleted — a later SA with the same name could inherit the
         stale permissions. The existing pattern for the addon and shared roles is
         followed.

      3. Strengthen RBAC tests:
         - TestIndexerClusterRoleExactRules: replaces approximate verb/resource
           guards with an exact deep-equal check of the full rule set plus required/
           forbidden spot-checks covering every rule and its inverse.
         - TestIndexerWorkloadIdentityContract: new test asserting that
           IndexerClusterRoleBinding.Subjects[0] and IndexerDeployment.ServiceAccountName
           both reference getIndexerServiceAccountName().

      Addresses CodeRabbit review comments on PR #791.

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      ---------

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>
