    pac.test.appstudio.openshift.io/sha-title: |-
      Fix pollBasedListerWatcher for client-go v0.35

      Cherry-picked two upstream fixes from prometheus-operator v0.90.0
      (PR #8431) to resolve e2e test failures caused by the automated
      dependency bump of k8s.io/client-go from v0.34 to v0.35.

      client-go v0.35 enables WatchListClient by default, which requires
      watchers to emit BOOKMARK events. The pollBasedListerWatcher does
      not support this protocol, causing:
      - nil pointer panic in poll() (listwatch.go:333)
      - 10s stalls from "event bookmark expired" warnings
      - Prometheus pods never starting (0/1 replicas)

      Changes:
      - fix: avoid panic in pollBasedListerWatcher (upstream eee6768)
      - fix: revert namespace lister/watcher to legacy mode (upstream 374f4de)
        Adds IsWatchListSemanticsUnSupported() to opt out of WatchList
        and fall back to the legacy List+Watch protocol.
      - Add e2e workflow name change to trigger CI testing

      Signed-off-by: George Aeillo <gaeillo@redhat.com>
