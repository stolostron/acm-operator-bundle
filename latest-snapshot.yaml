    pac.test.appstudio.openshift.io/sha-title: |-
      security: ACM-42544 — scope all delta-sync mutations to the authenticated cluster (#726) (#731)

      * security: ACM-42544 — scope all delta-sync mutations to the authenticated cluster

      UPDATE and DELETE operations in the delta-sync path did not include a
      cluster ownership check, allowing a spoke to mutate or delete rows
      belonging to any other cluster by submitting a crafted UID.

      Fixes five SQL statements across sync.go, goquHelper.go, and resync.go:

      1. UPDATE resources — added AND cluster=$3
         was: UPDATE search.resources SET data=$2 WHERE uid=$1
         now: UPDATE search.resources SET data=$2 WHERE uid=$1 AND cluster=$3

      2. DELETE resources — added cluster=$1 (parameter shift: cluster is now $1,
         UIDs are $2…$N)
         was: DELETE from search.resources WHERE uid IN (…)
         now: DELETE from search.resources WHERE cluster=$1 AND uid IN (…)

      3. DELETE edges (resource-delete path) — added cluster=$1 and wrapped the
         OR condition in parens to preserve logical precedence
         was: DELETE from search.edges WHERE sourceId IN (…) OR destId IN (…)
         now: DELETE from search.edges WHERE cluster=$1 AND (sourceId IN (…) OR destId IN (…))

      4. DELETE edges (per-edge path, both sync.go and resync.go) — added AND cluster=$4
         was: DELETE from search.edges WHERE sourceId=$1 AND destId=$2 AND edgeType=$3
         now: ... AND cluster=$4

      5. INSERT ON CONFLICT — added AND r.cluster=$2 to the update predicate so a
         uid collision from a different cluster does not overwrite the existing row
         was: DO UPDATE SET data=$3 WHERE r.uid=$1 AND r.data IS DISTINCT FROM $3
         now: DO UPDATE SET data=$3 WHERE r.uid=$1 AND r.cluster=$2 AND r.data IS DISTINCT FROM $3

      6. UID prefix validation — new validateUIDPrefix() helper rejects any resource
         whose UID does not begin with <clusterName>/ before it reaches the DB.
         Invalid resources are recorded in AddErrors/UpdateErrors and skipped.

      goquHelper.go updated to match the new query-string switch keys.
      All tests updated to use local-cluster as the cluster name, consistent
      with the UIDs present in the shared mock JSON fixtures.

      CVE: CVE-2026-76827


      * fix: use lowercase column names in edge delete query strings

      The switch-case keys in goquHelper.go and the query strings in sync.go
      and resync.go were changed to camelCase (sourceId/destId/edgeType)
      inconsistently with the rest of the file, which uses all-lowercase
      column names (sourceid/destid/edgetype) matching the PostgreSQL schema.

      Revert to lowercase throughout to stay consistent.



      * fix: address CodeRabbit review comments

      - resync.go: validate UID prefix in upsertResources before DB insert;
        add cluster ownership predicate to ON CONFLICT update (r.cluster=$2)
        so a cross-cluster UID in a full-resync payload cannot overwrite
        another cluster's row.
      - goquHelper.go: add new switch-case for the cluster-scoped resync
        ON CONFLICT query string.
      - sync_test.go: fail fast when fixture JSON decoding fails in
        loadSimpleSyncEvent (was silently ignoring decode errors).
      - syncHandler_test.go: set X-Overwrite-State: true in
        Test_resyncRequest_withErrorDeletingResources — the test exercises
        the full-resync path and must opt in to resync mode.

      Deferred: streaming JSON decoding for the full-resync body (tracked
      in ACM-42552).



