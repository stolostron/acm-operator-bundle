    pac.test.appstudio.openshift.io/sha: 8422ea4d256de39534f1d52083df32a09535384a
    pac.test.appstudio.openshift.io/sha-title: |-
      Ignore encryption keys not in cluster namespaces

      Previously, in hosted-mode deployments where the framework-addon pod for
      a managed cluster was deployed on the hub cluster (but was not managing
      `local-cluster`), the copied encryption key would be immediately rotated
      by the propagator. Usually a policy controller using that key would
      fallback to using the "previousKey" and not have any obvious issues, but
      sometimes it would decrypt noise which it attempted to apply on the
      cluster, which is almost guaranteed to cause a parsing error and fail.

      It's possible users may have noticed this behavior from the propagator
      by manually creating other Secrets on the hub, named
      "policy-encryption-key".

      Now, the encryptionkeys controller checks that the Secret being
      reconciled is in a managed cluster namespace, and ignores it if it
      isn't.

      Refs:
       - https://issues.redhat.com/browse/ACM-42671

      Signed-off-by: Justin Kulikauskas <jkulikau@redhat.com>
      (cherry picked from commit fb23ed11c3a1dd423643c0ade75b9f5e06de66d5)
