    pac.test.appstudio.openshift.io/sha-title: |-
      [release-2.17] ACM-34431: isolate collector with dedicated search-collector-sa ServiceAccount (#808)

      * ACM-34431: isolate collector with dedicated search-collector-sa ServiceAccount

      The search-collector shares the generic search-serviceaccount, which
      carries far more permissions than the collector needs. A compromise of
      the collector pod can therefore exercise those excess rights.

      Introduce a dedicated 'search-collector-sa' ServiceAccount bound to a
      new 'search-collector' ClusterRole with the minimum permissions verified
      from source (pkg/informer/runInformers.go, pkg/informer/supportedResources.go,
      pkg/lease/lease.go):

        - '*/*' get/list/watch — dynamic informers for cluster inventory
        - core/v1 configmaps get — reads search-collector-config allow/deny filter
        - search.open-cluster-management.io/collectorconfigs get/list/watch
            hot-reload of configurable collection rules
        - coordination.k8s.io/leases get/create/update — addon heartbeat

      The collector does not use impersonate, write access to secrets/services/
      deployments, tokenreviews, or any other verb verified absent from source.

      Part of ACM-34431 (FIND-001, CWE-269).

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * fix: address review comments on collector RBAC and tests

      Three issues addressed:

      1. Remove ineffective SetControllerReference from CollectorClusterRole and
         CollectorClusterRoleBinding. ClusterRole/ClusterRoleBinding are cluster-scoped;
         Search is namespaced. Kubernetes forbids a namespaced owner on a cluster-scoped
         dependent. Added explanatory comments pointing to finalizeSearch for cleanup.

      2. Add explicit cleanup of 'search-collector' ClusterRole and ClusterRoleBinding
         in finalizeSearch. Without owner references the resources are orphaned on
         Search CR deletion. Follows the same pattern as the API and indexer roles.

      3. Add TestCollectorWorkloadIdentityContract: constructs CollectorClusterRoleBinding
         and CollectorDeployment, then asserts both reference getCollectorServiceAccountName(),
         following the TestIndexerWorkloadIdentityContract pattern.

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      * fix: remove extra tlsEnvVars arg from CollectorDeployment for release-2.17 compat

      CollectorDeployment on release-2.17 takes only (ctx, instance) — the
      tlsEnvVars parameter was added later on main. Remove the nil third
      argument so the cherry-picked test compiles on this branch.

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>

      ---------

      Signed-off-by: Jorge Padilla <jpadilla@redhat.com>
