    pac.test.appstudio.openshift.io/sha-title: |-
      [release-5.0][ACM-42783] Detect container port changes to avoid duplicate port name errors (#4692)

      * ACM-42783: Detect container port changes to avoid duplicate port name errors

      Strategic merge patches merge a container's ports list by name instead
      of replacing it. Renaming or renumbering a port (e.g. acm-cli-downloads
      8443 "downloads" -> 8080 "downloads" between 2.17 and 5.0) results in
      two ports with the same name, which fails Deployment validation:

        spec.template.spec.containers[0].ports[1].name: Duplicate value: "downloads"

      Extend detectContainerChanges to also compare each container's ports
      between the existing and desired Deployment, in addition to the
      existing add/remove detection. When ports differ, Update is used
      instead of a server-side apply Patch, which replaces the full
      container spec cleanly and avoids the duplicate-name merge.

      This is the release-5.0 backport of the same fix applied to main.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * ACM-42783: Compare only containerPort numbers to avoid false positives

      Refine detectContainerChanges to compare only the containerPort
      numbers between existing and desired container specs, ignoring
      protocol/name/other port metadata that Kubernetes and strategic
      merge patches already reconcile correctly on their own.

      The previous full reflect.DeepEqual(ports) comparison produced a
      false positive for multicluster-operators-hub-subscription: its
      container port omits an explicit protocol in the desired template,
      but Kubernetes defaults the existing cluster object's port to
      protocol "TCP". That metadata-only difference was incorrectly
      triggering Update on every reconcile even though the port number
      (8443) never changed.

      Add containerPortNumbers() helper to extract and sort the
      containerPort values from a ports list, coercing numeric types
      since unstructured content may decode numbers as float64, int64,
      or int depending on source. Update detectContainerChanges to use
      this helper instead of comparing full port specs.

      Also add protocol: TCP to the multicluster-operators-hub-subscription
      template for consistency with all other Deployment templates, which
      already declare protocol explicitly.

      Update/add tests:
      - Rename port-name-only and protocol-only diff tests to reflect they
        should NOT trigger Update (want: false)
      - Add regression test for the multicluster-operators-hub-subscription
        scenario: existing port has protocol "TCP", desired port omits it

      Signed-off-by: dislbenn <dbennett@redhat.com>
      (cherry picked from commit 2041563c785f28cb32556bd9e67ff71588182d09)

      * ACM-42783: Fix nil vs empty-slice mismatch in containerPortNumbers

      multicluster-role-assignment-controller's 'manager' container declares
      ports: [] explicitly in its chart template, which decodes to a present
      but empty slice. The live Deployment, however, omits the 'ports' key
      entirely once fetched from the API, since corev1.Container.Ports has
      json:"ports,omitempty" and drops zero-length slices during
      serialization.

      containerPortNumbers() returned a bare nil when the ports field was
      absent, but []int64{} when present-but-empty, so reflect.DeepEqual in
      detectContainerChanges saw nil != []int64{} for containers with zero
      ports on both sides, and incorrectly triggered Update on every
      reconcile.

      Make containerPortNumbers always return a non-nil slice so both cases
      normalize to the same value. Add a regression test modeling the
      multicluster-role-assignment-controller scenario.

      Signed-off-by: dislbenn <dbennett@redhat.com>
      (cherry picked from commit 0f46d9cb7dd4eb2fd2cf58a791d77cf2475627f9)

      ---------

      Signed-off-by: dislbenn <dbennett@redhat.com>
