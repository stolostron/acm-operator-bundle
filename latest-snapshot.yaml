    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-43003 Pause NodePool when automation pre-hook is used for OpenShift Virtualization (#6787)

      * fix(clusters): pause NodePool when automation pre-hook is used for OpenShift Virtualization

      The KubeVirt HostedCluster template only set pausedUntil on the
      HostedCluster resource, not on the generated NodePool resource(s).
      When an automation template with an install pre-hook is selected,
      this caused the NodePool to start deploying nodes immediately
      instead of waiting for the pre-hook, and ClusterCurator later
      failed to unpause a NodePool that was never paused.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * test(clusters): verify NodePool is paused for KubeVirt install pre-hook (ACM-43003)

      Adds a regression test that selects an automation template with an
      install pre-hook for the OpenShift Virtualization wizard and asserts
      that both the HostedCluster and the NodePool are created with
      pausedUntil set. Fails without the fix in the previous commit.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * rabbit stew

      Signed-off-by: John Swanke <jswanke@redhat.com>

      ---------

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
