    pac.test.appstudio.openshift.io/sha-title: |-
      Verify Ansible Tower TLS by default with hub CA and optional skip-verify (#6963)

      The Ansible Tower proxy previously skipped TLS verification unconditionally.
      Change it to verify upstream certificates against system roots plus the hub
      CA, and only skip verification when ANSIBLE_INSECURE_SKIP_VERIFY=true or the
      credential Secret contains insecureSkipVerify=true. Update AGENTS.md, wire
      the new options through main, and add tests for untrusted rejection, global
      skip, secret-level skip, and hub-CA trust.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
