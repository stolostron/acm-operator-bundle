    pac.test.appstudio.openshift.io/sha: 3c51485a192feec831272d8a300803e262d53c4d
    pac.test.appstudio.openshift.io/sha-title: |-
      CNF-22905: Add multi-document YAML support to template engine (#1436)

      The template engine previously only parsed a single YAML document per
      template. Templates that produce multiple documents separated by '---'
      (e.g. a range loop emitting one CR per iteration) would silently drop
      all but the first document.

      This change updates render() to use yaml.NewDecoder for streaming
      multi-document parsing and updates renderManifestFromTemplate() to
      return []RenderedObject so each document is independently processed
      for prune/suppress/label logic.

      Assisted-by: Codex (GPT-6.1-Sol/medium)

      Signed-off-by: Allain Legacy <alegacy@redhat.com>
