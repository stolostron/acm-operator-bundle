      ACM-30253 Label storagemigrate ClusterRoles for ACM console discovery (#382)

      * update policy to include new storagemigration roles in ui

      Signed-off-by: kurwang <kurwang@redhat.com>

      * add migrations.kubevirt.io:view to virt clusterroles policy

