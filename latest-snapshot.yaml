    pac.test.appstudio.openshift.io/sha-title: |-
      [release-5.0] feat: enable TLS profile for oauth-proxy sidecars (#2784)

      * feat: enable TLS profile configuration for oauth-proxy sidecars

      Enable --tls-cipher-suites and --tls-min-version flags on all
      oauth-proxy sidecar containers (rbac-query-proxy, alertmanager,
      grafana) so they honor the cluster-wide TLS security profile.

      Previously these were left as TODOs because oauth-proxy did not
      support the flags.

      Signed-off-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>

      * test: assert TLS args on all oauth-proxy sidecars

      Add assertHasTLSArgs helper and verify --tls-cipher-suites and
      --tls-min-version are present on oauth-proxy containers for
      rbac-query-proxy, alertmanager, and grafana renderers. A removed
      or miswired SetTLSSecurityConfiguration call now fails loudly.

      Signed-off-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>

      * fix: gate oauth-proxy TLS flags behind OCP 5.0+ version check

      oauth-proxy on OCP 4.22/4.23 does not support --tls-cipher-suites
      and --tls-min-version flags. Only set them when ClusterVersion
      reports major version >= 5 to avoid CrashLoopBackOff on older
      clusters.

      Signed-off-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>

      * fix: use canonical Go cipher names for oauth-proxy TLS args

      Move cipher name normalization out of filterConfigurableCiphers so that
      SetTLSSecurityConfiguration passes canonical Go 1.22+ cipher names
      (with _SHA256 suffix) which oauth-proxy requires. Keep normalization
      in GetTLSSecurityConfiguration for observatorium-api which only accepts
      the pre-Go 1.22 short names. kube-rbac-proxy accepts both forms via
      k8s.io/component-base legacy aliases.

      Also return (bool, error) from IsOAuthProxyTLSSupported so transient
      ClusterVersion lookup failures propagate to the caller instead of
      silently dropping TLS flags. Only IsNotFound is treated as
      unsupported-platform.

      Signed-off-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>

      ---------

      Signed-off-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>
      Co-authored-by: Coleen Iona Quadros <coleen.quadros27@gmail.com>
