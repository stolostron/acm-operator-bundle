        serviceAccountName: multiclusterhub-operator
      permissions:
      - rules:
        - apiGroups:
          - ''
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: multiclusterhub-operator
      deployments:
      - label:
          control-plane: multiclusterhub-operator
        name: multiclusterhub-operator
        spec:
          replicas: 2
          selector:
            matchLabels:
              name: multiclusterhub-operator
          strategy: {}
          template:
            metadata:
              labels:
                name: multiclusterhub-operator
                ocm-antiaffinity-selector: multiclusterhub-operator
            spec:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                        - key: ocm-antiaffinity-selector
                          operator: In
                          values:
                          - multiclusterhub-operator
                      topologyKey: topology.kubernetes.io/zone
                    weight: 70
                  - podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                        - key: ocm-antiaffinity-selector
                          operator: In
                          values:
                          - multiclusterhub-operator
                      topologyKey: kubernetes.io/hostname
                    weight: 35
              containers:
              - args:
                - --leader-elect
                command:
                - multiclusterhub-operator
                env:
                - name: CRDS_PATH
                  value: /usr/local/templates/crds
                - name: TEMPLATES_PATH
                  value: /usr/local/templates
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: OPERAND_IMAGE_ACM_CLI
                  value: registry.redhat.io/rhacm2/acm-cli-rhel9@sha256:a26a1fc540065d5e157e5930a44c385d28862d4542143cbf4db46a60697666ae
                - name: OPERAND_IMAGE_ACM_MUST_GATHER
                  value: registry.redhat.io/rhacm2/acm-must-gather-rhel9@sha256:2b69d2d3a9b405c919754f030d916031b8e3a6e6ef6e740cd3cb8ef5ddfdbe51
                - name: OPERAND_IMAGE_CERT_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/cert-policy-controller-rhel9@sha256:4a94c91f8a461d92b246fb44b0a089b4128876e54f761c0b76fcbe87dc73ec56
                - name: OPERAND_IMAGE_CLUSTER_BACKUP_CONTROLLER
                  value: registry.redhat.io/rhacm2/cluster-backup-rhel9-operator@sha256:da2db0075a4396122cfe8ddf30ade2e3dc58789a679e912799f54e65aae6d6c1
                - name: OPERAND_IMAGE_CONFIG_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/config-policy-controller-rhel9@sha256:2d189a25c81efb49e9f34788c212e9e433c0ebc22139a0ef897bc06ed9c1e841
                - name: OPERAND_IMAGE_CONSOLE
                  value: registry.redhat.io/rhacm2/console-rhel9@sha256:ee33be01c505da74339d1ac78f72480e246920cef05135fd659f253870b7df64
                - name: OPERAND_IMAGE_ENDPOINT_MONITORING_OPERATOR
                  value: registry.redhat.io/rhacm2/endpoint-monitoring-rhel9-operator@sha256:35c9d23f7a9eaf1abfee05e999a65993151da5fc515017328e488124246aad1c
                - name: OPERAND_IMAGE_GOVERNANCE_POLICY_ADDON_CONTROLLER
