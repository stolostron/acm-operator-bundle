        serviceAccountName: multiclusterhub-operator
      permissions:
      - rules:
        - apiGroups:
          - ''
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: multiclusterhub-operator
      deployments:
      - label:
          control-plane: multiclusterhub-operator
        name: multiclusterhub-operator
        spec:
          replicas: 2
          selector:
            matchLabels:
              name: multiclusterhub-operator
          strategy: {}
          template:
            metadata:
              labels:
                name: multiclusterhub-operator
                ocm-antiaffinity-selector: multiclusterhub-operator
            spec:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                        - key: ocm-antiaffinity-selector
                          operator: In
                          values:
                          - multiclusterhub-operator
                      topologyKey: topology.kubernetes.io/zone
                    weight: 70
                  - podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                        - key: ocm-antiaffinity-selector
                          operator: In
                          values:
                          - multiclusterhub-operator
                      topologyKey: kubernetes.io/hostname
                    weight: 35
              containers:
              - args:
                - --leader-elect
                command:
                - multiclusterhub-operator
                env:
                - name: CRDS_PATH
                  value: /usr/local/templates/crds
                - name: TEMPLATES_PATH
                  value: /usr/local/templates
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: OPERAND_IMAGE_ACM_MUST_GATHER
                  value: registry.redhat.io/rhacm2/acm-must-gather-rhel9@sha256:41c1e92a4695a5c425217e03f20fe97641da3212e16cb4d3746f279f4a0b5ec8
                - name: OPERAND_IMAGE_CERT_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/cert-policy-controller-rhel9@sha256:0c9c4375e0114efe75e671b3293b4c5f20c8574dbc1bbdf8c236714e31ab131a
                - name: OPERAND_IMAGE_CLUSTER_BACKUP_CONTROLLER
