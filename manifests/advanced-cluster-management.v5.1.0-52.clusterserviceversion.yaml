                - name: OPERAND_IMAGE_CERT_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/cert-policy-controller-rhel9@sha256:97b7874ddca44a91d619dd22ea70b8246419ce39dcf8091b50d1ac386e96de44
                - name: OPERAND_IMAGE_CLUSTER_BACKUP_CONTROLLER
                  value: registry.redhat.io/rhacm2/cluster-backup-rhel9-operator@sha256:110eb3e49126c05f0aee2716a1aee90eeaf1ddec36346e3a2a0babafb7b1ff71
                - name: OPERAND_IMAGE_CONFIG_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/config-policy-controller-rhel9@sha256:e4b8a955d1e8eec1a6832b713440408c2e22c2adc8ff495eba7296a7e7ee57cd
                - name: OPERAND_IMAGE_CONSOLE
                  value: registry.redhat.io/rhacm2/console-rhel9@sha256:a576fe97bc9cab31320aa3154c4595c7a0a5fb1da450aa1bd64a3ce8f1651a89
                - name: OPERAND_IMAGE_DYNAMIC_SCORING_ADDON
                  value: registry.redhat.io/rhacm2/dynamic-scoring-addon-rhel9@sha256:f3a7627150f0ab9d42e54cb4ab118653f46a11284fc696bc80c0544ebb2dcd09
                - name: OPERAND_IMAGE_DYNAMIC_SCORING_CONTROLLER
