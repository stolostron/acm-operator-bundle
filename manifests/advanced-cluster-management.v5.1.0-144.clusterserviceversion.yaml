                - name: OPERAND_IMAGE_CERT_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/cert-policy-controller-rhel9@sha256:ddb6baebe40a44fe0fa5a18a8544b915f2fc484c6ae32e2ae33d5120753b8e31
                - name: OPERAND_IMAGE_CLUSTER_BACKUP_CONTROLLER
                  value: registry.redhat.io/rhacm2/cluster-backup-rhel9-operator@sha256:376ff3ce070d1055bfbcd0247bc60b89ab1ac731b05c8c1e19c90e33efeb55ed
                - name: OPERAND_IMAGE_CONFIG_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/config-policy-controller-rhel9@sha256:d0e4dcc54333dd4b4fd2ff87d38f6c6353da08a02b259837b093005118d38c99
                - name: OPERAND_IMAGE_CONSOLE
                  value: registry.redhat.io/rhacm2/console-rhel9@sha256:4aa83a95e8dc6170dcb02c1004dbc1d9826eab713d1414f85324aada4b840cca
                - name: OPERAND_IMAGE_DYNAMIC_SCORING_ADDON
                  value: registry.redhat.io/rhacm2/dynamic-scoring-addon-rhel9@sha256:8ce089970b69e07498aadfbf6cf3571563f0937c9feebb2cea9a2b443d33e7d9
                - name: OPERAND_IMAGE_DYNAMIC_SCORING_CONTROLLER
