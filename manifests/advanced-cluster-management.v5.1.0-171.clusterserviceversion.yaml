                - name: OPERAND_IMAGE_CERT_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/cert-policy-controller-rhel9@sha256:8e5e0aa3fb4d43cefc1808b931d06a1a55236ad7a845c2cfe8256f595e6bad4a
                - name: OPERAND_IMAGE_CLUSTER_BACKUP_CONTROLLER
                  value: registry.redhat.io/rhacm2/cluster-backup-rhel9-operator@sha256:8dcaf7b9f84b05ab053a129d9994bca0c6b6a0c4bd9e763c6f99f9e05f90ede7
                - name: OPERAND_IMAGE_CONFIG_POLICY_CONTROLLER
                  value: registry.redhat.io/rhacm2/config-policy-controller-rhel9@sha256:6bef236495d6146cc57ba57acae639ba613cabe870ffe7a727ba3566550094aa
                - name: OPERAND_IMAGE_CONSOLE
                  value: registry.redhat.io/rhacm2/console-rhel9@sha256:1962f8c9e1e63e010d262dbe3962ba84c84162fabac25ace3e1ee060db651a54
                - name: OPERAND_IMAGE_DYNAMIC_SCORING_ADDON
                  value: registry.redhat.io/rhacm2/dynamic-scoring-addon-rhel9@sha256:5bbb3953a4461e02108247704cc6c288aeb3c25820bf673492ccb67b81351fe7
                - name: OPERAND_IMAGE_DYNAMIC_SCORING_CONTROLLER
